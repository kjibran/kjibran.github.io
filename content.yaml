about:
  - >-
    I am a physicist and researcher at Aarhus University, where I work as Assistant Professor.
    For ten years I have worked in environmental modelling, with a focus on air quality and
    sound. My work combines domain knowledge from physical modelling with machine learning,
    and I have built forecasting systems that run operationally and deliver new predictions
    every hour.
  - >-
    After many years at leading research institutions, I am looking for industry roles in
    data science, machine learning and AI engineering. I want to work on systems that solve
    real problems for real users, with careful evaluation built in from the start. I also
    enjoy learning new tools and methods, and I keep building to stay current.