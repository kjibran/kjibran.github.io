projects_heading: Production ML and agentic AI
projects_note: >-
  End-to-end systems with automated pipelines, CI/CD, tests and monitoring. Each one is
  live and open source.

projects:
  - title: Ask Statistics Denmark
    image: agent.svg
    image_alt: The agent answering a question about Aarhus in four steps, with the answer and its source
    summary: >-
      An AI agent that answers questions about Denmark with official statistics. It uses RAG
      over 2,300 tables and LLM tool calling to find the right table, fetch the numbers and
      cite the source, and it shows every step it took.
    result: >-
      Hybrid search (BM25 and vector search with pgvector) evaluated on 48 labelled questions
      and tracked in MLflow. The agent answers 80 to 87% of test questions correctly and
      declines every question the data cannot answer.
    tech: [Python, LLMs, RAG, AI agents, tool calling, pgvector, PostgreSQL, SQL, MLflow, Gradio, CI/CD, GitHub Actions]
    links:
      - {label: Live demo, url: "https://huggingface.co/spaces/khajlk/ask-statistics-denmark"}
      - {label: Code and results, url: "https://github.com/kjibran/statbank-rag-agent"}
      - {label: Experiments, url: "https://dagshub.com/kjibran/statbank-rag-agent/experiments"}

  - title: Copenhagen NO₂ forecast
    image: no2_chart.png
    image_alt: Dashboard headline with the NO2 peak forecast for tomorrow and an hourly colour strip for the next 24 hours
    summary: >-
      A production-ready MLOps pipeline that forecasts hourly air pollution for the next
      24 hours at a busy Copenhagen street. Data ingestion, model scoring and the public
      dashboard update every hour without manual work.
    result: >-
      30% more accurate than a persistence baseline. Versioned training data, experiment
      tracking and a model registry, weekly automated retraining with champion and
      challenger models, and daily monitoring of accuracy and data drift.
    tech: [Python, SQL, PostgreSQL, LightGBM, MLOps, MLflow, FastAPI, Docker, CI/CD, GitHub Actions]
    links:
      - {label: Live dashboard, url: "https://kjibran.github.io/mlops-air-quality-forecast/"}
      - {label: Code and results, url: "https://github.com/kjibran/mlops-air-quality-forecast"}
      - {label: Dataset, url: "https://huggingface.co/datasets/khajlk/copenhagen-air-quality-hourly"}
      - {label: Experiments, url: "https://dagshub.com/kjibran/mlops-air-quality-forecast/experiments"}

  - title: LLM gateway
    image: gateway.svg
    image_alt: A request tried at Groq, which is rate limited, then answered by Gemini
    summary: >-
      A REST API in front of three LLM providers (Groq, Gemini and OpenRouter) with automatic
      failover. When one provider fails, the request moves to the next, and every attempt is
      logged with its latency and error.
    result: >-
      Built and tested while providers retired a model, moved a free model to paid only and
      returned overload errors. The gateway kept answering without any change for its users.
    tech: [Python, FastAPI, REST API, LLMs, Docker, pytest, CI/CD, GitHub Actions, Render]
    links:
      - {label: Live demo, url: "https://huggingface.co/spaces/khajlk/llm-gateway-demo"}
      - {label: Code, url: "https://github.com/kjibran/llm-gateway"}

research_heading: Applied ML research
research_note: >-
  Peer-reviewed deep learning studies from 2026, with code, data and trained models openly
