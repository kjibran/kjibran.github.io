research:
  - title: Fine-tuning audio transformers for vehicle sound classification
    image: paper2_figure.png
    image_alt: Bar chart of balanced F1 for five models, rising from 0.26 for the CNN baseline to 0.50 for BEATs with ArcFace
    summary: >-
      Fine-tuned pre-trained audio transformers (BEATs, AST) to recognise vehicles by sound,
      trained on recordings from Germany and tested on recordings from Australia.
    result: >-
      77% better than a CNN baseline. ArcFace metric learning raised the rarest class,
      buses with 53 training samples, from 0.38 to 0.54 F1.
    tech: [Python, PyTorch, Hugging Face Transformers, transfer learning, domain adaptation, scikit-learn, librosa]
    credit: "Figure: Khan (2026), Acoustics 8(3), 63. CC BY 4.0."
    links:
      - {label: Paper, url: "https://doi.org/10.3390/acoustics8030063"}
      - {label: Code, url: "https://doi.org/10.5281/zenodo.22203993"}

  - title: Synthetic training data from physics and generative AI
    image: paper1_figure.png
    image_alt: Spectrograms of real, physics-simulated and AI-generated sounds of cars, trucks and motorcycles
    summary: >-
      Trained a vehicle sound classifier on real recordings plus synthetic sounds from a physics
      simulator and from AudioLDM, a text-to-audio diffusion model, then tested it on recordings
      from other countries and microphones.
    result: >-
      Combining both synthetic sources improved balanced F1 by 55% over training on real
      data alone.
    tech: [Python, deep learning, CNN, generative AI, diffusion models, data augmentation]
    credit: "Figure: Khan, Ryzhikov and Kolehmainen (2026), Applied Sciences 16(14), 7234. CC BY 4.0."
    links:
      - {label: Paper, url: "https://doi.org/10.3390/app16147234"}
      - {label: Code, url: "https://doi.org/10.5281/zenodo.21264250"}

principles:
  - title: Check the data before the model.
    text: >-
      Most problems start in the data, so that is where I look first. In the forecasting
      project this uncovered mislabelled years in a provider's API and a silent change in how
      seven years of measurements had been processed.
  - title: Measure every change.
    text: >-
      Each change is compared with a baseline and logged in MLflow. When hybrid search first
      made results worse, the numbers showed why and how to fix it.
  - title: Build for the day after launch.
    text: >-
      Versioned data, automated tests, monitoring and scheduled retraining keep the systems
      running without manual care.
  - title: Document what did not work.
    text: >-
      Rejected models, failed approaches and known limitations are written up next to the
      results.

