name: Check links

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1"  # Mondays 06:37 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build the site
        run: |
          uv sync --frozen
          uv run python build.py
      - name: Check every link on the page
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 and 429: the page exists, but the site blocks or slows automated checks
          # (common for publishers and LinkedIn). Real breakage like 404 still fails.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,403,429
            --exclude-mail
            site/index.html
          fail: true
